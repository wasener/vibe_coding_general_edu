<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ app_title }}{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body { background-color: #F7FAF9; color: #212529; }
    .navbar-brand { font-weight: 700; color: #146C43 !important; }
    .nav-tabs .nav-link.active { color: #146C43; font-weight: 600; }
    .nav-tabs .nav-link { color: #495057; }
</style>
</head>
<body>
<nav class="navbar navbar-light bg-white border-bottom shadow-sm mb-3">
    <div class="container">
        <span class="navbar-brand">🩺 {{ app_title }}</span>
    </div>
</nav>

<div class="container">
    <ul class="nav nav-tabs mb-4">
        <li class="nav-item">
            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{{ url_for('chat_page') }}">對話</a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.path == '/settings' %}active{% endif %}" href="{{ url_for('settings_page') }}">提示內容編輯</a>
        </li>
    </ul>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}" role="alert">{{ message }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>
</body>
</html>

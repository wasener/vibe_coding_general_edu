<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}健保藥局查詢{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body { background-color: #F7FAF9; color: #212529; }
    .navbar-brand { font-weight: 700; color: #146C43 !important; }
    .badge-open { background-color: #146C43; }
    .badge-closed { background-color: #adb5bd; }
    .table thead th { white-space: nowrap; }
</style>
</head>
<body>
<nav class="navbar navbar-light bg-white border-bottom shadow-sm mb-4">
    <div class="container">
        <span class="navbar-brand">🏥 健保特約醫事機構－藥局查詢</span>
    </div>
</nav>

<div class="container pb-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}" role="alert">{{ message }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
